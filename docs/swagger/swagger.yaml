      quota:
        $ref: '#/definitions/groupdelivery.QuotaStatusView'
      recent_bucket_issues:
        items:
          $ref: '#/definitions/groupdelivery.BucketIssue'
        type: array
      revision_stages:
        $ref: '#/definitions/grouppipeline.RevisionStagesView'
      skipped_buckets:
        type: integer
      source_evidence:
        allOf:
        - $ref: '#/definitions/grouppipeline.SourceEvidenceView'
        description: SourceEvidence is the per source result of the applied revision;
          absent for wide, custom and unapplied groups.
      stages:
        $ref: '#/definitions/grouppipeline.StagesView'
      storage:
        $ref: '#/definitions/grouppipeline.StorageView'
    type: object
  grouppipeline.IntakeView:
    properties:

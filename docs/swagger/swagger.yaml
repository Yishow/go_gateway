basePath: /api
definitions:
  groupdelivery.AttentionItem:
    properties:
      connector_id:
        type: string
      connector_revision:
        type: string
      effect_key:
        type: string
      error_code:
        type: string
      group_revision:
        type: string
      payload_digest:
        type: string
      state:
        type: string
      state_revision:
        type: integer
      table_name:
        type: string
      table_schema:
        type: string
    type: object
  groupdelivery.BucketIssue:
    properties:
      bucket_start:
        type: string
      causes:
        items:
          type: string
        type: array
      group_revision:
        type: string
      kind:
        type: string
    type: object
  groupdelivery.CommittedEffect:
    properties:
      committed_at:
        type: string
      connector_revision:
        type: string
      effect_key:
        type: string
      group_revision:
        type: string
      payload_digest:
        type: string
      record_id:
        type: string
    type: object
  groupdelivery.DecisionResult:
    properties:
      decision_id:
        type: string
      duplicate:
        type: boolean
      effect_key:
        type: string
      state:
        type: string

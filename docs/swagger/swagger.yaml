        required: true
        type: string
      - description: Complete local review intent; not mutation authority
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.WriteGroupSuccessorReviewRequest'
      produces:
      - application/json
      responses:

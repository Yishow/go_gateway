        type: string
      tag_id:
        type: string
    type: object
  grouppipeline.SourceEvidenceView:
    properties:
      connector_id:
        description: |-
          ConnectorID and ConnectorRevision are the destination the applied revision froze, which is where every
          record below was written. They are never the editable draft's destination.
        type: string
      connector_revision:
        type: string
      group_revision:
        type: string
      sources:
        items:
          $ref: '#/definitions/grouppipeline.SourceEvidenceItem'
        type: array
      state:
        type: string
      unavailable_reason:
        type: string
    type: object
  grouppipeline.StagesView:

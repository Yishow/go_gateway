  /v1/datalink/studio-v2/workspace/write-groups/{id}/successor:
    post:
      consumes:
      - application/json
      description: |-
        Swagger 2 cannot express this action-dependent request/response union. The body schema is ONLY a discriminator, not a complete payload: select exactly one complete request and response_data model from x-action-contracts below. Unknown fields and fields from other actions are rejected; there are no per-stage URLs. Every successful response wraps the selected response_data as {success:true,data:...}.
        Scope: path id is original G1. Preserve the immutable original envelope and envelope.request.operation_id (root) for reserve/schema/activation; refreshed current CAS belongs in current for schema actions or stage.current for activation-review (then inside the activation envelope), never rebased into the original envelope. The immutable reserve result is not current CAS. A preview's operation_id is used as schema_operation_id for schema-confirm, never as the root; first-start result operation_id is also distinct from root_operation_id.
        reserve requires action/envelope/review_digest and records only a reserved draft; required capability checks may probe. schema-preview requires action/envelope/review_digest/current, may perform external read-only probes and save a local token, but never DDL. schema-confirm additionally requires token/digest/schema_operation_id and explicit permission for the stored server plan; inspect returned SchemaOperation.status even on HTTP 200, or 202 while in progress.
        activation-review requires action/stage/boundary and is local read only with explicit future B. activation-readiness requires action/activation envelope/review_digest and may inspect the target without DDL or activation. activation-confirm and first-start-confirm both additionally require readiness_digest and recheck scope/CAS/schema/readiness/future B. activation-confirm returns the existing WriteGroupCutover for cutover (valid old v1 may omit activation_kind); first-start-confirm requires first_start and returns WriteGroupSuccessorFirstStartResult, never a fake cutover. The two confirmations are not interchangeable.
        operation-status requires only action/workspace_id/lineage_id/original operation_id and path G1, no current CAS or target access. It is a coherent local read of immutable reserve, all related schema operations, cutover and first-start outcomes. A succeeded stage is not runtime running and not SQL committed. On unknown transport/outcome, retain the original request and query status before any permitted exact retry; do not switch intent/root or assume rollback. No general rebase/cancel endpoint exists.
      parameters:
      - description: Original predecessor group ID (G1), not reserved G2 or current
          head
        in: path
        name: id
        required: true
        type: string
      - description: Discriminator only; use exactly one complete request from x-action-contracts
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.WriteGroupSuccessorAction'
      produces:
      - application/json
      responses:
        "200":
          description: success=true; data is exactly the selected x-action-contracts
            response_data model; schema status may be succeeded, failed, partial or
            unknown
          schema:
            $ref: '#/definitions/handlers.WriteGroupSuccessorResponse'
        "202":
          description: 'schema-confirm only: schema operation is still in progress,
            not confirmed success'
          schema:
            $ref: '#/definitions/handlers.WriteGroupSuccessorSchemaResponse'
        "400":
          description: 'WRITE_GROUP_INVALID_REQUEST: unknown/mixed action fields,
            missing scope/confirmation, malformed JSON or wrong activation kind'
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "404":
          description: 'WRITE_GROUP_NOT_FOUND or RECORDING_SCHEMA_PREVIEW_NOT_FOUND:
            original scoped resource missing'
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: revision_mismatch, lifecycle/ownership conflict, stale/expired
            preview, operation mismatch or busy; preserve original root and inspect
            typed code/action
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Invalid/unsupported transition, boundary, capability, schema,
            permission or connector; no implicit fallback
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "500":
          description: Typed local service failure; do not infer that a timed-out
            mutation rolled back
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "501":
          description: 'RECORDING_SCHEMA_NOT_IMPLEMENTED: schema-confirm adapter has
            no verified execution'
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service/target/ownership unavailable or RECORDING_SCHEMA_OPERATION_UNKNOWN;
            error.operation_id, when present, identifies the schema operation, not
            the root
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Execute one explicit successor action or read its original operation
        status
      tags:
      - Studio V2 Write Groups
      x-action-contracts:
        activation-confirm:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorCutoverConfirmRequest'
          response_data: '#/definitions/workspace.WriteGroupCutover'
          success_statuses:
          - 200
        activation-readiness:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorReadinessRequest'
          response_data: '#/definitions/workspace.WriteGroupSuccessorActivationReadiness'
          success_statuses:
          - 200
        activation-review:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorActivationReviewRequest'
          response_data: '#/definitions/workspace.WriteGroupSuccessorActivationReview'
          success_statuses:
          - 200
        first-start-confirm:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorFirstStartConfirmRequest'
          response_data: '#/definitions/workspace.WriteGroupSuccessorFirstStartResult'
          success_statuses:
          - 200
        operation-status:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorStatusRequest'
          response_data: '#/definitions/workspace.WriteGroupSuccessorOperationStatus'
          success_statuses:
          - 200
        reserve:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorReserveRequest'
          response_data: '#/definitions/workspace.WriteGroupSuccessorPreparation'
          success_statuses:
          - 200
        schema-confirm:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorConfirmRequest'
          response_data: '#/definitions/recordingplan.SchemaOperation'
          success_statuses:
          - 200
          - 202
        schema-preview:
          error: '#/definitions/handlers.APIErrorResponse'
          request: '#/definitions/handlers.WriteGroupSuccessorPreviewRequest'
          response_data: '#/definitions/recordingplan.SchemaPreviewToken'
          success_statuses:
          - 200
  /v1/datalink/studio-v2/workspace/write-groups/{id}/successor-review:
    post:
      consumes:
      - application/json
      description: Local read only. Requires original workspace/lineage/G1/connector
        CAS, candidate group, original operation_id and explicit boundary. Returns
        a frozen envelope and review_digest, advisory history/blockers/required_checks;
        no reservation, preview token, external probe, DDL or activation. Later actions
        must preserve the original envelope and revalidate current scope.
      parameters:

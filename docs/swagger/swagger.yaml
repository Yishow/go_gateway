      payload_digest:
        type: string
      reason:
        type: string
      resolution:
        $ref: '#/definitions/groupdelivery.QuarantineResolution'
    type: object
  groupdelivery.QuarantineResolution:
    enum:
    - retry
    - skip
    type: string
    x-enum-varnames:
    - ResolutionRetry
    - ResolutionSkip
  groupdelivery.QuotaScope:
    enum:
    - global
    - group
    type: string
    x-enum-varnames:
    - QuotaScopeGlobal
    - QuotaScopeGroup
  groupdelivery.QuotaStatusView:
    properties:
      configured:
        type: boolean
      intake_refused:
        type: boolean
      loss_risk_notice:
        type: string
      max_bytes:
        type: integer
      scope:
        $ref: '#/definitions/groupdelivery.QuotaScope'
      state:
        type: string
      used_bytes:
        type: integer
    type: object
  groupdelivery.SourceAggregation:
    properties:
      basis:
        type: string
      coverage:
        type: string
      method:
        type: string
      reason:
        type: string
      rejected_count:
        type: integer
      result_type:
        type: string
      source_type:
        type: string
      valid_count:
        type: integer
      version:
        type: string
    type: object
  groupdelivery.SourceDelivery:
    enum:
    - queued
    - retrying
    - blocked
    - quarantined
    - unknown
    - sql_committed
    - operator_skipped
    type: string
    x-enum-varnames:
    - SourceDeliveryQueued
    - SourceDeliveryRetrying
    - SourceDeliveryBlocked
    - SourceDeliveryQuarantined
    - SourceDeliveryUnknown
    - SourceDeliveryCommitted
    - SourceDeliverySkipped
  groupdelivery.SourceRecord:
    properties:
      aggregation:
        allOf:
        - $ref: '#/definitions/groupdelivery.SourceAggregation'
        description: 'Aggregation is the verified evidence of a mean window: method,
          counts and coverage, never a value.'
      available:
        type: boolean
      cause:
        $ref: '#/definitions/groupdelivery.SourceUnavailableCause'
      committed_at:
        description: CommittedAt is set only when the destination receipt matched
          this payload.
        type: string
      connector_revision:
        type: string
      delivery:
        $ref: '#/definitions/groupdelivery.SourceDelivery'
      delta_known:
        description: DeltaKnown is set for cumulative records only; false is an unknown
          difference, never zero.
        type: boolean
      effect_key:
        type: string
      group_revision:
        type: string
      payload_digest:
        type: string
      profile_kind:
        type: string
      raw_present:
        type: boolean
      reason:
        type: string
      record_id:
        type: string
      status:
        $ref: '#/definitions/groupdelivery.SourceStatus'
      window_end:
        type: string
      window_start:
        type: string
    type: object
  groupdelivery.SourceStatus:
    enum:
    - ok
    - partial
    - baseline
    - missing
    - bad
    - stale
    - invalid
    - reset_or_uncertain
    - gap
    type: string
    x-enum-varnames:
    - SourceStatusOK
    - SourceStatusPartial
    - SourceStatusBaseline
    - SourceStatusMissing
    - SourceStatusBad
    - SourceStatusStale
    - SourceStatusInvalid
    - SourceStatusUncertain
    - SourceStatusGap
  groupdelivery.SourceUnavailableCause:
    enum:
    - payload_invalid
    - digest_mismatch
    - identity_mismatch
    - status_unknown
    - window_invalid
    type: string
    x-enum-varnames:
    - SourceCausePayloadInvalid
    - SourceCauseDigestMismatch
    - SourceCauseIdentityMismatch
    - SourceCauseStatusUnknown
    - SourceCauseWindowInvalid
  grouppipeline.BacklogView:
    properties:
      connector_id:
        type: string
      connector_revision:
        type: string
      error_codes:

basePath: /api
definitions:
  handlers.APIErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handlers.TypedAPIErrorEnvelope'
      success:
        example: false
        type: boolean
    type: object
  handlers.ActivateWorkspaceRequest:
    properties:
      pending_saves:
        type: integer
      readiness_token:
        type: string
      save_error:
        type: string
      settings_revision:
        type: string
      workspace_revision:
        type: string
    required:
    - readiness_token
    - settings_revision
    - workspace_revision
    type: object
  handlers.HealthStatus:
    properties:
      service:
        example: datalink
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2024-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  handlers.MappingPreviewRequest:
    properties:
      raw_value: {}
      transform_pipeline:
        items:
          $ref: '#/definitions/schema.TransformStep'
        type: array
    type: object
  handlers.MappingPreviewResponse:
    properties:
      error:
        type: string
      final_value: {}
      raw_value: {}
      step_results:
        items:
          $ref: '#/definitions/mapping.StepResult'
        type: array
    type: object
  handlers.ReconcileRequest:
    properties:
      canonical_plan_signature:
        type: string
      desired_mappings:
        items:
          $ref: '#/definitions/modbusshare.DesiredMapping'
        type: array
      expected_settings_revision:
        type: string
      expected_workspace_revision:
        type: string
      readiness_token:
        type: string
      workspace_id:
        type: string
    type: object
  handlers.StartModbusShareRequest:
    properties:
      expected_settings_revision:
        type: string
      port:
        type: integer
    type: object
  handlers.StopModbusShareRequest:
    properties:
      expected_settings_revision:
        type: string
    type: object
  handlers.TypedAPIErrorEnvelope:
    properties:
      action:
        type: string
      code:
        type: string
      dirty_state:
        type: string
      message:
        type: string
      request_id:
        type: string
      retryable:
        type: boolean
      settings_revision:
        type: string
      workspace_revision:
        type: string
    type: object
  handlers.UpdateSettingRequest:
    properties:
      expected_settings_revision:
        type: string
      value: {}
    type: object
  handlers.UpsertMirrorMappingRequest:
    properties:
      register:
        type: integer
    required:
    - register
    type: object
  handlers.WriteTagValueRequest:
    properties:
      tag_id:
        type: string
      value: {}
    required:
    - tag_id
    - value
    type: object
  handlers.runtimeWorkspaceContextDeviceEntry:
    properties:
      availability_reason:
        type: string
      availability_status:
        type: string
      device_id:
        type: string
      name:
        type: string
      projection_alignment:
        type: string
      projection_code:
        type: string
      projection_message:
        type: string
      protocol:
        type: string
      running:
        type: boolean
      runtime_projection_version:
        type: string
      workspace_projection_version:
        type: string
    type: object
  handlers.runtimeWorkspaceContextResponse:
    properties:
      default_device_id:
        type: string
      devices:
        items:
          $ref: '#/definitions/handlers.runtimeWorkspaceContextDeviceEntry'
        type: array
      setup:
        $ref: '#/definitions/handlers.runtimeWorkspaceSetupContextResponse'
      workspace_id:
        type: string
    type: object
  handlers.runtimeWorkspaceSetupContextResponse:
    properties:
      database_config:
        $ref: '#/definitions/handlers.studioV2WorkspaceDatabaseConfigResponse'
      database_targets:
        items:
          $ref: '#/definitions/handlers.runtimeWorkspaceSetupDatabaseTargetMapping'
        type: array
      mappings:
        items:
          $ref: '#/definitions/handlers.runtimeWorkspaceSetupMappingResponse'
        type: array
      readiness_summary:
        $ref: '#/definitions/workspace.ReadinessSummary'
      source_rules:
        items:
          $ref: '#/definitions/handlers.runtimeWorkspaceSetupSourceRuleResponse'
        type: array
    type: object
  handlers.runtimeWorkspaceSetupDatabaseTargetMapping:
    properties:
      column_name:
        type: string
      connector_id:
        type: string
      enabled:
        type: boolean
      group_key:
        type: string
      id:
        type: string
      table_name:
        type: string
      table_schema:
        type: string
      tag_id:
        type: string
      timestamp_column:
        type: string
      write_interval_seconds:
        type: integer
      write_mode:
        $ref: '#/definitions/schema.DatabaseWriteMode'
    type: object
  handlers.runtimeWorkspaceSetupMappingResponse:
    properties:
      address:
        type: string
      device_id:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      point_id:
        type: string
      rule_id:
        type: string
      status:
        $ref: '#/definitions/schema.MappingStatus'
      tag_id:
        type: string
      tag_key:
        type: string
      target_type:
        $ref: '#/definitions/schema.DataType'
      unit:
        type: string
    type: object
  handlers.runtimeWorkspaceSetupSourceRuleResponse:
    properties:
      count:
        type: integer
      data_type:
        $ref: '#/definitions/schema.DataType'
      device_id:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      naming_prefix:
        type: string
      revision_id:
        type: string
      start_address:
        type: string
      target_data_type:
        $ref: '#/definitions/schema.DataType'
    type: object
  handlers.studioV2WorkspaceDatabaseConfigResponse:
    properties:
      created_at: {}
      database:
        type: string
      host:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/schema.DatabaseConnectorKind'
      last_flush_at:
        type: string
      last_flush_error:
        type: string
      last_flush_status:
        type: string
      last_schema_ensure_at:
        type: string
      last_schema_ensure_error:
        type: string
      last_schema_ensure_status:
        type: string
      last_write_at:
        type: string
      last_write_error:
        type: string
      last_write_status:
        type: string
      name:
        type: string
      port:
        type: integer
      row_groups:
        items:
          $ref: '#/definitions/workspace.DatabaseRowGroup'
        type: array
      runtime_apply_issues:
        items:
          $ref: '#/definitions/workspace.ReadinessIssue'
        type: array
      runtime_apply_message:
        type: string
      runtime_apply_status:
        type: string
      save_state:
        type: string
      schema:
        type: string
      status:
        $ref: '#/definitions/schema.DatabaseConnectorStatus'
      table:
        type: string
      timestamp_column:
        type: string
      updated_at: {}
      username:
        type: string
      workspace_id:
        type: string
      write_interval_seconds:
        type: integer
      write_mode:
        $ref: '#/definitions/schema.DatabaseWriteMode'
    type: object
  mapping.StepResult:
    properties:
      error:
        type: string
      input: {}
      output: {}
      step_index:
        type: integer
      step_type:
        type: string
    type: object
  modbusshare.DesiredMapping:
    properties:
      capacity_registers:
        type: integer
      data_type:
        $ref: '#/definitions/schema.DataType'
      display_name:
        type: string
      mapping_id:
        type: string
      ownership_proof:
        $ref: '#/definitions/modbusshare.OwnershipProof'
      share_start_register:
        description: Human 40001 domain
        type: integer
      source_rule_id:
        type: string
      source_rule_revision:
        type: string
      span_registers:
        type: integer
      stride_registers:
        type: integer
      tag_id:
        type: string
      tag_key:
        type: string
      workspace_id:
        type: string
      zero_based_register:
        description: Zero-based index (40001 -> 0)
        type: integer
    type: object
  modbusshare.OwnershipProof:
    properties:
      basis:
        type: string
      source_rule_id:
        type: string
      source_rule_revision:
        type: string
      verified:
        type: boolean
      workspace_id:
        type: string
    type: object
  schema.DataType:
    enum:
    - bool
    - int16
    - uint16
    - int32
    - uint32
    - int64
    - uint64
    - float32
    - float64
    - string
    type: string
    x-enum-varnames:
    - DataTypeBool
    - DataTypeInt16
    - DataTypeUint16
    - DataTypeInt32
    - DataTypeUint32
    - DataTypeInt64
    - DataTypeUint64
    - DataTypeFloat32
    - DataTypeFloat64
    - DataTypeString
  schema.DatabaseConnectorKind:
    enum:
    - sqlite
    - postgres
    - mysql
    - sqlserver
    type: string
    x-enum-varnames:
    - DatabaseConnectorKindSQLite
    - DatabaseConnectorKindPostgres
    - DatabaseConnectorKindMySQL
    - DatabaseConnectorKindSQLServer
  schema.DatabaseConnectorStatus:
    enum:
    - ready
    - unreachable
    - auth_failed
    - error
    type: string
    x-enum-varnames:
    - DatabaseConnectorStatusReady
    - DatabaseConnectorStatusUnreachable
    - DatabaseConnectorStatusAuthFailed
    - DatabaseConnectorStatusError
  schema.DatabaseWriteMode:
    enum:
    - insert
    - upsert
    type: string
    x-enum-varnames:
    - DatabaseWriteModeInsert
    - DatabaseWriteModeUpsert
  schema.MappingStatus:
    enum:
    - draft
    - validated
    - active
    - out_of_sync
    - error
    type: string
    x-enum-varnames:
    - MappingStatusDraft
    - MappingStatusValidated
    - MappingStatusActive
    - MappingStatusOutOfSync
    - MappingStatusError
  schema.TransformStep:
    properties:
      order:
        description: Order 執行順序 (從小到大)
        type: integer
      params:
        additionalProperties: true
        description: Params 轉換參數 (依類型不同)
        type: object
      type:
        allOf:
        - $ref: '#/definitions/schema.TransformType'
        description: Type 轉換類型
    type: object
  schema.TransformType:
    enum:
    - decode
    - cast
    - scale
    - lookup
    - conditional
    - formula
    type: string
    x-enum-varnames:
    - TransformDecode
    - TransformCast
    - TransformScale
    - TransformLookup
    - TransformConditional
    - TransformFormula
  workspace.DatabaseRowGroup:
    properties:
      connector_id:
        type: string
      group_key_columns:
        items:
          type: string
        type: array
      id:
        type: string
      member_point_ids:
        items:
          type: string
        type: array
      table_name:
        type: string
      table_schema:
        type: string
      unique_key_columns:
        items:
          type: string
        type: array
    type: object
  workspace.ReadinessIssue:
    properties:
      code:
        type: string
      message:
        type: string
      scope:
        type: string
      severity:
        $ref: '#/definitions/workspace.ReadinessSeverity'
      step:
        $ref: '#/definitions/workspace.ReadinessStep'
    type: object
  workspace.ReadinessSeverity:
    enum:
    - blocking
    - warning
    type: string
    x-enum-varnames:
    - ReadinessSeverityBlocking
    - ReadinessSeverityWarning
  workspace.ReadinessStep:
    enum:
    - Step 1
    - Step 2
    - Step 3
    - Step 4
    type: string
    x-enum-varnames:
    - ReadinessStep1
    - ReadinessStep2
    - ReadinessStep3
    - ReadinessStep4
  workspace.ReadinessSummary:
    properties:
      blocking_count:
        type: integer
      issues:
        items:
          $ref: '#/definitions/workspace.ReadinessIssue'
        type: array
      ready:
        type: boolean
      warning_count:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 工業數據採集閘道系統 API 文檔
  title: Go Gateway API
  version: "1.0"
paths:
  /datalink/health:
    get:
      consumes:
      - application/json
      description: 檢查 Datalink 服務的健康狀態
      produces:
      - application/json
      responses:
        "200":
          description: 健康狀態
          schema:
            $ref: '#/definitions/handlers.HealthStatus'
      summary: 健康檢查
      tags:
      - datalink
  /datalink/mappings/preview:
    post:
      consumes:
      - application/json
      description: Returns server-computed preview values. Typed failures never expose
        backend exception details.
      parameters:
      - description: Preview request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.MappingPreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MappingPreviewResponse'
        "400":
          description: Invalid preview request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Preview unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Preview a mapping pipeline
      tags:
      - datalink
  /datalink/modbus-share/mappings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: List workspace-scoped Modbus Share mappings
      tags:
      - datalink
  /datalink/modbus-share/mappings/{tagId}:
    delete:
      parameters:
      - description: Tag identifier
        in: path
        name: tagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Delete a workspace-scoped Modbus Share mapping
      tags:
      - datalink
    put:
      consumes:
      - application/json
      parameters:
      - description: Tag identifier
        in: path
        name: tagId
        required: true
        type: string
      - description: Register allocation
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.UpsertMirrorMappingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Upsert a workspace-scoped Modbus Share mapping
      tags:
      - datalink
  /datalink/modbus-share/reconcile:
    post:
      consumes:
      - application/json
      parameters:
      - description: Complete workspace desired mapping set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ReconcileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Reconcile Modbus Share projection
      tags:
      - datalink
  /datalink/modbus-share/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Listener settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.StartModbusShareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Start Modbus Share listener
      tags:
      - datalink
  /datalink/modbus-share/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Get Modbus Share status
      tags:
      - datalink
  /datalink/modbus-share/stop:
    post:
      consumes:
      - application/json
      parameters:
      - description: Optional settings revision guard
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.StopModbusShareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stop Modbus Share listener and persist disabled state
      tags:
      - datalink
  /datalink/modbus-share/sync:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Synchronize mapped point values to Modbus Share memory
      tags:
      - datalink
  /datalink/modbus-share/write-tag-value:
    post:
      consumes:
      - application/json
      parameters:
      - description: Mapped tag value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.WriteTagValueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Write a mapped tag value to Modbus Share memory
      tags:
      - datalink
  /datalink/preview/stream:
    get:
      description: Opens a text/event-stream backed by the runtime value source for
        the persisted mapping. Failure responses use the typed safe-error envelope
        before the stream starts; a runtime stream failure is emitted as an SSE error
        event.
      parameters:
      - description: Persisted mapping identifier
        in: query
        name: mapping_id
        required: true
        type: string
      - description: Workspace scope
        in: query
        name: workspace_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of connected, preview, heartbeat, and error events
          schema:
            type: string
        "422":
          description: Mapping identifier is missing or invalid
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Preview mapping or runtime stream is unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stream a persisted mapping preview
      tags:
      - datalink
  /datalink/runtime/status:
    get:
      description: Returns runtime collector state and metrics without synthesizing
        a ready snapshot on failure.
      parameters:
      - description: Device ID
        in: query
        name: device_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Runtime snapshot unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Get runtime status
      tags:
      - datalink
  /datalink/runtime/stream:
    get:
      description: Opens an SSE stream for runtime updates. Failure responses use
        the typed safe-error envelope.
      parameters:
      - description: Device ID
        in: query
        name: device_id
        required: true
        type: string
      - description: Comma-separated point IDs
        in: query
        name: point_ids
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Runtime device is missing
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Runtime stream unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stream runtime updates
      tags:
      - datalink
  /datalink/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: List durable settings
      tags:
      - datalink
  /datalink/settings/{key}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: Settings value and expected revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Update durable settings
      tags:
      - datalink
  /datalink/studio-v2/workspace/activate:
    post:
      consumes:
      - application/json
      description: Activates the persisted workspace after hydration, save, and revision
        checks.
      parameters:
      - description: Activation barrier revisions and save state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ActivateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object

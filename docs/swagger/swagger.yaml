  handlers.WriteGroupMutationRequest:
    properties:
      expected_connector_revision:
        type: string
      expected_group_revision:
        type: string
      expected_workspace_revision:
        type: string
      group:
        $ref: '#/definitions/workspace.WriteGroup'
      workspace_id:
        type: string
    type: object
  handlers.WriteGroupReadinessResponse:
    properties:
      data:
        $ref: '#/definitions/workspace.WriteGroupReadiness'
      success:
        type: boolean
    type: object
  handlers.WriteGroupResolutionResponse:
    properties:
      data:
        $ref: '#/definitions/groupdelivery.DecisionResult'
      success:
        type: boolean
    type: object
  handlers.WriteGroupSaveResponse:
    properties:
      data:
        $ref: '#/definitions/workspace.WriteGroupSaveResult'
      success:
        type: boolean
    type: object
  handlers.WriteGroupSchemaRequest:
    properties:
      expected_connector_revision:
        type: string
      expected_group_revision:
        type: string
      expected_workspace_revision:
        type: string
      operation_id:
        type: string
      token:
        type: string
      workspace_id:
        type: string
    type: object
  handlers.WriteGroupSuccessorAction:
    description: Swagger 2 cannot express this action-dependent union. Select exactly
      one full request from the operation's x-action-contracts; fields from other
      actions are rejected. Sending only action is invalid.
    properties:
      action:
        enum:
        - reserve
        - schema-preview
        - schema-confirm
        - activation-review
        - activation-readiness
        - activation-confirm
        - first-start-confirm
        - operation-status
        type: string
    required:
    - action
    type: object
  handlers.WriteGroupSuccessorActivationReviewRequest:
    description: activation-review is local read only after schema preparation, using
      original stage envelope plus current CAS and an explicit future boundary B.
      The returned activation_kind selects cutover versus first_start; it grants no
      activation permission.
    properties:
      action:
        enum:
        - activation-review
        type: string
      boundary:
        type: string
      stage:
        $ref: '#/definitions/handlers.WriteGroupSuccessorStageRequest'
    required:
    - action
    - boundary
    - stage
    type: object
  handlers.WriteGroupSuccessorConfirmRequest:
    description: schema-confirm requires the preview's token, 64-character digest
      and schema_operation_id, plus original envelope and current CAS. Only the server-stored
      plan can execute DDL. Exact confirmation replay keeps its recorded operation.
      HTTP 200 is a recorded stage result, not necessarily succeeded; HTTP 202 means
      in progress. Never substitute schema_operation_id for the root operation ID.
    properties:
      action:
        enum:
        - schema-confirm
        type: string
      current:
        $ref: '#/definitions/handlers.WriteGroupSuccessorCurrentCAS'
      digest:
        maxLength: 64
        minLength: 64
        type: string
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorEnvelope'
      review_digest:
        type: string
      schema_operation_id:
        type: string
      token:
        type: string
    required:
    - action
    - current
    - digest
    - envelope
    - review_digest
    - schema_operation_id
    - token
    type: object
  handlers.WriteGroupSuccessorCurrentCAS:
    description: Current CAS is refreshed for a new stage; it never replaces the original
      immutable envelope or root operation ID. group_id/group_revision name reserved
      G2, predecessor_revision names path G1. An immutable reserve result is not current
      CAS.
    properties:
      group_id:
        type: string
      group_revision:
        type: string
      lineage_revision:
        minimum: 1
        type: integer
      predecessor_connector_revision:
        type: string
      predecessor_revision:
        type: string
      target_connector_revision:
        type: string
      workspace_revision:
        type: string
    required:
    - group_id
    - group_revision
    - lineage_revision
    - predecessor_connector_revision
    - predecessor_revision
    - target_connector_revision
    - workspace_revision
    type: object
  handlers.WriteGroupSuccessorCutoverConfirmRequest:
    description: activation-confirm requires the unchanged activation envelope, review_digest
      and readiness_digest; it rechecks future B, scope/CAS, schema and live readiness.
      activation_kind must be cutover; only a valid legacy v1 envelope may omit it.
      first_start envelopes are rejected. Success preserves the existing WriteGroupCutover
      response, not proof of runtime or target writes.
    properties:
      action:
        enum:
        - activation-confirm
        type: string
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorActivationEnvelope'
      readiness_digest:
        maxLength: 64
        minLength: 64
        type: string
      review_digest:
        maxLength: 64
        minLength: 64
        type: string
    required:
    - action
    - envelope
    - readiness_digest
    - review_digest
    type: object
  handlers.WriteGroupSuccessorFirstStartConfirmRequest:
    description: first-start-confirm requires activation_kind=first_start in the unchanged
      activation envelope and both digests. It rechecks whole-lineage absence of applied/intake/history
      evidence, current CAS, schema/readiness and explicit future B. It returns WriteGroupSuccessorFirstStartResult,
      never an invented predecessor end/cutover/fence. Cutover envelopes are rejected.
    properties:
      action:
        enum:
        - first-start-confirm
        type: string
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorActivationEnvelope'
      readiness_digest:
        maxLength: 64
        minLength: 64
        type: string
      review_digest:
        maxLength: 64
        minLength: 64
        type: string
    required:
    - action
    - envelope
    - readiness_digest
    - review_digest
    type: object
  handlers.WriteGroupSuccessorPreviewRequest:
    description: schema-preview may perform external read-only target probes and stores
      a preview token locally; it never executes DDL or activates intake. The returned
      operation_id is a schema operation ID, not the original root ID.
    properties:
      action:
        enum:
        - schema-preview
        type: string
      current:
        $ref: '#/definitions/handlers.WriteGroupSuccessorCurrentCAS'
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorEnvelope'
      review_digest:
        type: string
    required:
    - action
    - current
    - envelope
    - review_digest
    type: object
  handlers.WriteGroupSuccessorReadinessRequest:
    description: activation-readiness requires the exact activation-review envelope/digest,
      including its stage current CAS and future B. It may inspect the target but
      performs no DDL or activation; readiness_digest is evidence, not a persisted
      grant.
    properties:
      action:
        enum:
        - activation-readiness
        type: string
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorActivationEnvelope'
      review_digest:
        maxLength: 64
        minLength: 64
        type: string
    required:
    - action
    - envelope
    - review_digest
    type: object
  handlers.WriteGroupSuccessorReserveRequest:
    description: reserve revalidates original envelope scope/CAS and may probe required
      source/target capabilities. Exact replay returns the immutable original reservation
      even after head/revisions advance; changed intent under the same root conflicts.
      It does not run DDL or activate intake.
    properties:
      action:
        enum:
        - reserve
        type: string
      envelope:
        $ref: '#/definitions/workspace.WriteGroupSuccessorEnvelope'
      review_digest:
        type: string
    required:
    - action
    - envelope
    - review_digest
    type: object
  handlers.WriteGroupSuccessorResponse:
    description: data is exactly the selected action's response_data schema in x-action-contracts,
      not an arbitrary combination. A recorded stage success is not runtime running
      and not SQL committed.
    properties:
      data:
        additionalProperties: {}
        type: object
      success:
        example: true
        type: boolean
    type: object
  handlers.WriteGroupSuccessorReviewRequest:
    description: All scope and original CAS fields are required. Path id is G1. operation_id
      is the original root request ID, never a schema operation or first-start result
      ID. group is a candidate, not authority; boundary is an explicit timestamp,
      not permission to activate.
    properties:
      boundary:
        type: string
      expected_lineage_revision:

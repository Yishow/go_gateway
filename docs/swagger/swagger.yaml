      groupID:
        type: string
      groupRevision:
        type: string
      workspaceID:
        type: string
    type: object
  groupdelivery.LifecycleHandoff:
    properties:
      origin:
        $ref: '#/definitions/groupdelivery.GroupKey'
      samples:
        type: integer
      source:
        $ref: '#/definitions/groupdelivery.GroupKey'
      state:
        type: string
      target:
        $ref: '#/definitions/groupdelivery.GroupKey'
    type: object
  groupdelivery.LifecycleOutboxCounts:
    properties:
      blocked:
        type: integer
      outstanding:
        type: integer
      quarantined:
        type: integer
      queued:
        type: integer
      retrying:
        type: integer
      skipped:
        type: integer
      sql_committed:
        type: integer
      total:
        type: integer
      unknown:
        type: integer
    type: object
  groupdelivery.LifecyclePending:
    properties:
      handoffs:
        items:
          $ref: '#/definitions/groupdelivery.LifecycleHandoff'
        type: array
      outbox:
        $ref: '#/definitions/groupdelivery.LifecycleOutboxCounts'

host: localhost:8080
info:
  contact: {}
  description: 工業數據採集閘道系統 API 文檔
  title: Go Gateway API
  version: "1.0"
paths:
  /datalink/health:
    get:
      consumes:
      - application/json
      description: 檢查 Datalink 服務的健康狀態
      produces:
      - application/json
      responses:
        "200":
          description: 健康狀態
          schema:
            $ref: '#/definitions/handlers.HealthStatus'
      summary: 健康檢查
      tags:
      - datalink
  /datalink/mappings/preview:
    post:
      consumes:
      - application/json
      description: Returns server-computed preview values. Typed failures never expose
        backend exception details.
      parameters:
      - description: Preview request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.MappingPreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MappingPreviewResponse'
        "400":
          description: Invalid preview request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Preview unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Preview a mapping pipeline
      tags:
      - datalink
  /datalink/modbus-share/mappings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: List workspace-scoped Modbus Share mappings
      tags:
      - datalink
  /datalink/modbus-share/mappings/{tagId}:
    delete:
      parameters:
      - description: Tag identifier
        in: path
        name: tagId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Delete a workspace-scoped Modbus Share mapping
      tags:
      - datalink
    put:
      consumes:
      - application/json
      parameters:
      - description: Tag identifier
        in: path
        name: tagId
        required: true
        type: string
      - description: Register allocation
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.UpsertMirrorMappingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Upsert a workspace-scoped Modbus Share mapping
      tags:
      - datalink
  /datalink/modbus-share/reconcile:
    post:
      consumes:
      - application/json
      parameters:
      - description: Complete workspace desired mapping set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ReconcileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Reconcile Modbus Share projection
      tags:
      - datalink
  /datalink/modbus-share/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Listener settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.StartModbusShareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Start Modbus Share listener
      tags:
      - datalink
  /datalink/modbus-share/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Get Modbus Share status
      tags:
      - datalink
  /datalink/modbus-share/stop:
    post:
      consumes:
      - application/json
      parameters:
      - description: Optional settings revision guard
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.StopModbusShareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stop Modbus Share listener and persist disabled state
      tags:
      - datalink
  /datalink/modbus-share/sync:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Synchronize mapped point values to Modbus Share memory
      tags:
      - datalink
  /datalink/modbus-share/write-tag-value:
    post:
      consumes:
      - application/json
      parameters:
      - description: Mapped tag value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.WriteTagValueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Write a mapped tag value to Modbus Share memory
      tags:
      - datalink
  /datalink/preview/stream:
    get:
      description: Opens a text/event-stream backed by the runtime value source for
        the persisted mapping. Failure responses use the typed safe-error envelope
        before the stream starts; a runtime stream failure is emitted as an SSE error
        event.
      parameters:
      - description: Persisted mapping identifier
        in: query
        name: mapping_id
        required: true
        type: string
      - description: Workspace scope
        in: query
        name: workspace_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of connected, preview, heartbeat, and error events
          schema:
            type: string
        "422":
          description: Mapping identifier is missing or invalid
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Preview mapping or runtime stream is unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stream a persisted mapping preview
      tags:
      - datalink
  /datalink/runtime/status:
    get:
      description: Returns runtime collector state and metrics without synthesizing
        a ready snapshot on failure.
      parameters:
      - description: Device ID
        in: query
        name: device_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Runtime snapshot unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Get runtime status
      tags:
      - datalink
  /datalink/runtime/stream:
    get:
      description: Opens an SSE stream for runtime updates. Failure responses use
        the typed safe-error envelope.
      parameters:
      - description: Device ID
        in: query
        name: device_id
        required: true
        type: string
      - description: Comma-separated point IDs
        in: query
        name: point_ids
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Runtime device is missing
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "503":
          description: Runtime stream unavailable
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Stream runtime updates
      tags:
      - datalink
  /datalink/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: List durable settings
      tags:
      - datalink
  /datalink/settings/{key}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: Settings value and expected revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.APIErrorResponse'
      summary: Update durable settings
      tags:
      - datalink
  /datalink/studio-v2/workspace/activate:
    post:
      consumes:
      - application/json
      description: Activates the persisted workspace after hydration, save, and revision
        checks.
      parameters:
      - description: Activation barrier revisions and save state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ActivateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":

        type: string
      expected_workspace_revision:
        type: string
      review_digest:
        type: string
      source_ids:
        items:
          type: string
        type: array
      workspace_id:
        type: string
    type: object
  handlers.WriteGroupMigrationReviewResponse:
    properties:
      data:
        $ref: '#/definitions/workspace.WriteGroupMigrationReviewResult'

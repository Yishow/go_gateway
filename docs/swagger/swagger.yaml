        type: string
      state:
        type: string
    type: object
  grouppipeline.RevisionStagesView:
    properties:
      group_revision:
        type: string
      stages:
        $ref: '#/definitions/grouppipeline.StagesView'
    type: object
  grouppipeline.SourceEvidenceItem:
    properties:
      circuit_id:
        type: string
      device_id:
        type: string
      last_sql_committed:
        $ref: '#/definitions/groupdelivery.SourceRecord'
      latest:
        $ref: '#/definitions/groupdelivery.SourceRecord'

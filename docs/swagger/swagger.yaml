    type: object
  grouppipeline.DeliveryView:
    properties:
      attention:
        items:
          $ref: '#/definitions/groupdelivery.AttentionItem'
        type: array
      backlog:
        items:
          $ref: '#/definitions/grouppipeline.BacklogView'
        type: array
      counter_replay_quarantines:
        items:
          $ref: '#/definitions/grouppipeline.CounterReplayQuarantine'
        type: array
      group_id:
        type: string
      intake:
        $ref: '#/definitions/grouppipeline.IntakeView'
      last_sql_committed_at:
        type: string
      last_sql_committed_effect:
        $ref: '#/definitions/groupdelivery.CommittedEffect'
      no_data_buckets:
        type: integer
      oldest_pending_seconds:

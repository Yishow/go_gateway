<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.05" />
    </filter>
    <filter id="shadow-md" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.15" />
    </filter>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8FAFC" />

  <!-- Left Navigation Sidebar -->
  <rect x="0" y="0" width="280" height="1080" fill="#0F172A" />
  <!-- Logo Area -->
  <rect x="30" y="35" width="32" height="32" rx="8" fill="#3B82F6" />
  <path d="M40 51 L46 57 L56 43" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="75" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="1">DataSync</text>
  
  <!-- Navigation Items -->
  <text x="40" y="140" fill="#94A3B8" font-family="sans-serif" font-size="16" font-weight="bold">核心功能</text>
  
  <text x="40" y="195" fill="#94A3B8" font-family="sans-serif" font-size="18">儀表板 (Dashboard)</text>
  
  <rect x="0" y="230" width="280" height="56" fill="#1E293B" />
  <rect x="0" y="230" width="4" height="56" fill="#3B82F6" />
  <text x="40" y="265" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">任務建立</text>
  
  <text x="40" y="335" fill="#94A3B8" font-family="sans-serif" font-size="18">任務管理</text>
  <text x="40" y="395" fill="#94A3B8" font-family="sans-serif" font-size="18">資料來源</text>
  <text x="40" y="455" fill="#94A3B8" font-family="sans-serif" font-size="18">監控與報告</text>
  
  <text x="40" y="535" fill="#94A3B8" font-family="sans-serif" font-size="16" font-weight="bold">系統設定</text>
  <text x="40" y="590" fill="#94A3B8" font-family="sans-serif" font-size="18">全域配置</text>
  <text x="40" y="650" fill="#94A3B8" font-family="sans-serif" font-size="18">Feature Flags</text>

  <!-- User Info Bottom -->
  <line x1="20" y1="980" x2="260" y2="980" stroke="#1E293B" stroke-width="1" />
  <rect x="30" y="1005" width="40" height="40" rx="20" fill="#334155" />
  <text x="50" y="1031" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A</text>
  <text x="85" y="1022" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="bold">Admin User</text>
  <text x="85" y="1042" fill="#94A3B8" font-family="sans-serif" font-size="12">Workspace Owner</text>

  <!-- Top Status Bar -->
  <rect x="280" y="0" width="1640" height="80" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
  <text x="340" y="48" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold">任務建立</text>
  
  <!-- Feature Flag Status Badge -->
  <rect x="470" y="24" width="230" height="32" rx="16" fill="#ECFDF5" stroke="#10B981" />
  <circle cx="490" cy="40" r="5" fill="#10B981" />
  <text x="505" y="45" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">Feature Flag (灰度上線): 啟用中</text>

  <!-- Top Right Icons -->
  <rect x="1740" y="20" width="40" height="40" rx="8" fill="#F1F5F9" />
  <path d="M1760 30 A 4 4 0 0 0 1754 36 A 4 4 0 0 0 1766 36 A 4 4 0 0 0 1760 30" stroke="#64748B" stroke-width="2" fill="none" />
  <path d="M1752 46 Q 1760 40 1768 46" stroke="#64748B" stroke-width="2" fill="none" />
  
  <rect x="1800" y="20" width="40" height="40" rx="8" fill="#F1F5F9" />
  <path d="M1815 35 L 1815 30 A 5 5 0 0 1 1825 30 L 1825 35" stroke="#64748B" stroke-width="2" fill="none" />
  <rect x="1812" y="35" width="16" height="12" rx="2" fill="#64748B" />

  <text x="1860" y="46" fill="#475569" font-family="sans-serif" font-size="16">說明文件</text>

  <!-- Main Content Header -->
  <text x="340" y="160" fill="#0F172A" font-family="sans-serif" font-size="32" font-weight="bold">選擇任務建立方式</text>
  <text x="340" y="200" fill="#64748B" font-family="sans-serif" font-size="18">依據您的資料同步需求與複雜度，選擇最適合的配置模式。系統目前採雙入口策略同時推進。</text>

  <!-- Center Two Entry Point Cards -->
  
  <!-- Card 1: Quick Setup (Default & Emphasized) -->
  <rect x="340" y="260" width="560" height="520" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3" filter="url(#shadow-lg)" />
  
  <!-- Recommended Ribbon Badge -->
  <path d="M 760 260 L 884 260 Q 900 260 900 276 L 900 300 L 760 300 Z" fill="url(#primary-gradient)" />
  <text x="830" y="285" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">★ 系統預設推薦</text>

  <rect x="390" y="310" width="88" height="88" rx="20" fill="#EFF6FF" />
  <path d="M434 330 L420 360 L435 360 L430 380 L448 350 L434 350 Z" fill="#3B82F6" />
  
  <text x="390" y="445" fill="#0F172A" font-family="sans-serif" font-size="30" font-weight="bold">快速入口 (Quick Setup)</text>
  <text x="390" y="490" fill="#475569" font-family="sans-serif" font-size="18">適合標準化流程與常見資料源，一鍵套用最佳</text>
  <text x="390" y="525" fill="#475569" font-family="sans-serif" font-size="18">實踐範本。大幅減少人為配置錯誤並提升效率。</text>

  <circle cx="400" cy="570" r="8" fill="#10B981" />
  <text x="420" y="576" fill="#334155" font-family="sans-serif" font-size="16">自動推斷 Schema 與欄位映射</text>
  
  <circle cx="400" cy="610" r="8" fill="#10B981" />
  <text x="420" y="616" fill="#334155" font-family="sans-serif" font-size="16">智慧排程與預設重試機制</text>

  <circle cx="400" cy="650" r="8" fill="#10B981" />
  <text x="420" y="656" fill="#334155" font-family="sans-serif" font-size="16">最快 3 分鐘內完成任務部署</text>

  <!-- Primary Button -->
  <rect x="390" y="700" width="460" height="56" rx="8" fill="url(#primary-gradient)" />
  <text x="620" y="734" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">立即使用快速入口</text>


  <!-- Card 2: Advanced Setup -->
  <rect x="940" y="260" width="560" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-md)" />
  
  <rect x="990" y="310" width="88" height="88" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <circle cx="1034" cy="354" r="14" fill="none" stroke="#64748B" stroke-width="3" />
  <line x1="1034" y1="334" x2="1034" y2="340" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="1034" y1="368" x2="1034" y2="374" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="1014" y1="354" x2="1020" y2="354" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="1048" y1="354" x2="1054" y2="354" stroke="#64748B" stroke-width="3" stroke-linecap="round" />

  <text x="990" y="445" fill="#0F172A" font-family="sans-serif" font-size="30" font-weight="bold">進階自訂 (Advanced Setup)</text>
  <text x="990" y="490" fill="#64748B" font-family="sans-serif" font-size="18">適合複雜場景與特規需求，讓您完全掌控所有</text>
  <text x="990" y="525" fill="#64748B" font-family="sans-serif" font-size="18">環境配置、效能調優與參數覆寫。</text>

  <circle cx="1000" cy="570" r="8" fill="#CBD5E1" />
  <text x="1020" y="576" fill="#475569" font-family="sans-serif" font-size="16">複雜轉換邏輯與自訂腳本 (ETL)</text>
  
  <circle cx="1000" cy="610" r="8" fill="#CBD5E1" />
  <text x="1020" y="616" fill="#475569" font-family="sans-serif" font-size="16">精細化資源分配與依賴管理</text>

  <circle cx="1000" cy="650" r="8" fill="#CBD5E1" />
  <text x="1020" y="656" fill="#475569" font-family="sans-serif" font-size="16">支援多節點、多來源混合配置</text>

  <!-- Secondary Button -->
  <rect x="990" y="700" width="460" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <text x="1220" y="734" fill="#334155" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">開始進階設定</text>


  <!-- Right Sidebar (Recent Tasks & Drafts) -->
  <rect x="1540" y="260" width="340" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-md)" />
  
  <text x="1570" y="310" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">最近建立</text>
  <line x1="1570" y1="330" x2="1850" y2="330" stroke="#F1F5F9" stroke-width="2" />
  
  <!-- Task 1 -->
  <rect x="1570" y="350" width="280" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="1585" y="380" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">CRM_Sales_Sync</text>
  <text x="1585" y="405" fill="#64748B" font-family="sans-serif" font-size="14">進階自訂 • 15 分鐘前</text>
  <circle cx="1825" cy="385" r="5" fill="#10B981" />

  <!-- Task 2 -->
  <rect x="1570" y="435" width="280" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="1585" y="465" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">App_Events_Log</text>
  <text x="1585" y="490" fill="#64748B" font-family="sans-serif" font-size="14">快速入口 • 2 小時前</text>
  <circle cx="1825" cy="470" r="5" fill="#10B981" />

  <text x="1570" y="560" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="bold">未完成草稿 (2)</text>
  <line x1="1570" y1="580" x2="1850" y2="580" stroke="#F1F5F9" stroke-width="2" />

  <!-- Draft 1 -->
  <rect x="1570" y="600" width="280" height="70" rx="8" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1" />
  <text x="1585" y="630" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="bold">Marketing_Campaign_v2</text>
  <text x="1585" y="655" fill="#B45309" font-family="sans-serif" font-size="14">快速入口 • 步驟 2/4</text>

  <!-- Draft 2 -->
  <rect x="1570" y="685" width="280" height="70" rx="8" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1" />
  <text x="1585" y="715" fill="#92400E" font-family="sans-serif" font-size="16" font-weight="bold">Payment_Gateway_ETL</text>
  <text x="1585" y="740" fill="#B45309" font-family="sans-serif" font-size="14">進階自訂 • 步驟 1/5</text>

  <!-- Bottom Risk & Rollback Area -->
  <rect x="340" y="850" width="1540" height="70" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="2" />
  
  <path d="M 370 895 L 385 865 L 400 895 Z" fill="#EF4444" />
  <text x="385" y="890" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">!</text>
  
  <text x="420" y="890" fill="#991B1B" font-family="sans-serif" font-size="18" font-weight="bold">風險與回滾提示：</text>
  <text x="580" y="890" fill="#7F1D1D" font-family="sans-serif" font-size="18">當前「快速入口」正處於 Feature Flag 灰度測試階段。若您在使用新版流程時遇到任何阻礙或異常狀況，可隨時</text>
  <text x="1515" y="890" fill="#7F1D1D" font-family="sans-serif" font-size="18">切換至原版進階模式。</text>

  <rect x="1690" y="865" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" />
  <text x="1770" y="891" fill="#DC2626" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">一鍵回滾 (Rollback)</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff" />
      <stop offset="100%" stop-color="#096dd9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f0f2f5" />

  <!-- Header -->
  <rect width="1920" height="64" fill="#ffffff" filter="url(#shadow-sm)" />
  <g transform="translate(48, 20)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#001529">Go Gateway</text>
  </g>
  
  <g transform="translate(250, 38)">
    <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="500" fill="#1890ff">首頁</text>
    <rect x="-8" y="14" width="48" height="2" fill="#1890ff" />
    <text x="80" y="0" font-family="sans-serif" font-size="16" fill="#595959">服務管理</text>
    <text x="190" y="0" font-family="sans-serif" font-size="16" fill="#595959">路由規則</text>
    <text x="300" y="0" font-family="sans-serif" font-size="16" fill="#595959">監控儀表板</text>
    <text x="430" y="0" font-family="sans-serif" font-size="16" fill="#595959">系統設定</text>
  </g>

  <!-- User Profile -->
  <g transform="translate(1800, 16)">
    <circle cx="16" cy="16" r="16" fill="#e6f7ff" />
    <text x="16" y="21" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1890ff" text-anchor="middle">AD</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(240, 120)">
    <!-- Lightweight Guidance -->
    <text x="0" y="40" font-family="sans-serif" font-size="32" font-weight="bold" fill="#262626">歡迎使用 Go Gateway</text>
    <text x="0" y="72" font-family="sans-serif" font-size="16" fill="#595959">為了協助您更有效率地完成工作，請選擇適合您目前任務的入口模式：</text>

    <!-- Entry Cards Container (Dual Entry) -->
    <!-- Card 1: Quick Setup (Emphasized) -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="700" height="260" rx="12" fill="#ffffff" stroke="#1890ff" stroke-width="2" filter="url(#shadow-md)" />
      <!-- Top Accent Line -->
      <path d="M0,12 a12,12 0 0,1 12,-12 h676 a12,12 0 0,1 12,12 v4 h-700 z" fill="#1890ff"/>
      
      <!-- Icon -->
      <g transform="translate(40, 48)">
        <circle cx="32" cy="32" r="32" fill="#e6f7ff" />
        <svg x="16" y="16" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1890ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </g>
      
      <!-- Title & Badge -->
      <text x="120" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#262626">快速設定 (Quick Setup)</text>
      <rect x="420" y="58" width="60" height="24" rx="12" fill="#e6f7ff" />
      <text x="450" y="74" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1890ff" text-anchor="middle">預設推薦</text>

      <!-- Description -->
      <text x="120" y="120" font-family="sans-serif" font-size="16" fill="#595959">使用引導式精靈，在 3 分鐘內完成基本路由、反向代理與</text>
      <text x="120" y="145" font-family="sans-serif" font-size="16" fill="#595959">負載平衡設定。適合初次使用或執行日常標準配置任務。</text>
      
      <!-- Features List -->
      <circle cx="120" cy="178" r="4" fill="#1890ff" />
      <text x="135" y="183" font-family="sans-serif" font-size="14" fill="#8c8c8c">包含常見架構範本 (REST API, 靜態網站服務)</text>
      
      <circle cx="120" cy="203" r="4" fill="#1890ff" />
      <text x="135" y="208" font-family="sans-serif" font-size="14" fill="#8c8c8c">自動生成 SSL/TLS 憑證與基礎中介軟體</text>

      <!-- CTA Button -->
      <rect x="520" y="180" width="140" height="40" rx="4" fill="url(#primary-grad)" cursor="pointer"/>
      <text x="590" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">立即開始</text>
    </g>

    <!-- Card 2: Advanced Configuration (Normal/Subtle) -->
    <g transform="translate(740, 120)">
      <rect x="0" y="0" width="700" height="260" rx="12" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" filter="url(#shadow-sm)" />
      
      <!-- Icon -->
      <g transform="translate(40, 48)">
        <circle cx="32" cy="32" r="32" fill="#f5f5f5" />
        <svg x="16" y="16" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </g>
      
      <!-- Title -->
      <text x="120" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#262626">進階配置 (Advanced)</text>

      <!-- Description -->
      <text x="120" y="120" font-family="sans-serif" font-size="16" fill="#595959">直接存取完整的管理控制台，自訂各項中介軟體 (Middleware)、</text>
      <text x="120" y="145" font-family="sans-serif" font-size="16" fill="#595959">複雜的路由比對規則、全域限流策略與服務發現整合設定。</text>
      
      <!-- Features List -->
      <circle cx="120" cy="178" r="4" fill="#bfbfbf" />
      <text x="135" y="183" font-family="sans-serif" font-size="14" fill="#8c8c8c">全面控制所有底層參數與 YAML/JSON 編輯</text>
      
      <circle cx="120" cy="203" r="4" fill="#bfbfbf" />
      <text x="135" y="208" font-family="sans-serif" font-size="14" fill="#8c8c8c">進階安全防護策略與自訂監控指標設定</text>

      <!-- CTA Button (Outline) -->
      <rect x="520" y="180" width="140" height="40" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1" cursor="pointer"/>
      <text x="590" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#595959" text-anchor="middle">進入控制台</text>
    </g>

    <!-- Divider Section -->
    <line x1="0" y1="440" x2="1440" y2="440" stroke="#e8e8e8" stroke-width="1" />

    <!-- Legacy / Existing Layout Area: System Status & Recent Activities -->
    <g transform="translate(0, 480)">
      <text x="0" y="0" font-family="sans-serif" font-size="20" font-weight="bold" fill="#262626">系統運行狀態</text>
      
      <!-- Row: Metrics Cards (Existing layout placeholder) -->
      <g transform="translate(0, 30)">
        <!-- Metric 1 -->
        <rect x="0" y="0" width="340" height="120" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" />
        <text x="24" y="32" font-family="sans-serif" font-size="14" fill="#8c8c8c">總請求數 (過去 24h)</text>
        <text x="24" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#262626">12.4M</text>
        <!-- Mini sparkline mock -->
        <path d="M 240 80 Q 260 60 280 70 T 310 40" fill="none" stroke="#52c41a" stroke-width="2" />
        <text x="260" y="32" font-family="sans-serif" font-size="14" fill="#52c41a" font-weight="bold">↑ 8.2%</text>

        <!-- Metric 2 -->
        <rect x="366" y="0" width="340" height="120" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" />
        <text x="390" y="32" font-family="sans-serif" font-size="14" fill="#8c8c8c">活躍路由規則</text>
        <text x="390" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#262626">128</text>

        <!-- Metric 3 -->
        <rect x="732" y="0" width="340" height="120" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" />
        <text x="756" y="32" font-family="sans-serif" font-size="14" fill="#8c8c8c">錯誤率 (5xx)</text>
        <text x="756" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#262626">0.02%</text>
        <text x="1000" y="32" font-family="sans-serif" font-size="14" fill="#f5222d" font-weight="bold">↓ 1.1%</text>

        <!-- Metric 4 -->
        <rect x="1098" y="0" width="342" height="120" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" />
        <text x="1122" y="32" font-family="sans-serif" font-size="14" fill="#8c8c8c">平均延遲 (ms)</text>
        <text x="1122" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#262626">45</text>
        <text x="1370" y="32" font-family="sans-serif" font-size="14" fill="#faad14" font-weight="bold">- 0.0%</text>
      </g>

      <!-- Row: Recent Activities Table (Existing layout placeholder) -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="1440" height="230" rx="8" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" />
        <text x="24" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#262626">近期配置變更</text>
        <text x="1350" y="36" font-family="sans-serif" font-size="14" fill="#1890ff" cursor="pointer">查看全部</text>
        
        <!-- Table Header -->
        <rect x="24" y="56" width="1392" height="40" fill="#fafafa" />
        <text x="40" y="81" font-family="sans-serif" font-size="14" font-weight="bold" fill="#595959">時間</text>
        <text x="200" y="81" font-family="sans-serif" font-size="14" font-weight="bold" fill="#595959">操作人員</text>
        <text x="400" y="81" font-family="sans-serif" font-size="14" font-weight="bold" fill="#595959">模組</text>
        <text x="600" y="81" font-family="sans-serif" font-size="14" font-weight="bold" fill="#595959">描述</text>

        <line x1="24" y1="96" x2="1416" y2="96" stroke="#f0f0f0" />
        
        <!-- Table Row 1 -->
        <text x="40" y="125" font-family="sans-serif" font-size="14" fill="#595959">2026-03-02 10:23:45</text>
        <text x="200" y="125" font-family="sans-serif" font-size="14" fill="#595959">admin@company.com</text>
        <rect x="395" y="110" width="56" height="24" rx="4" fill="#e6f7ff" stroke="#91d5ff" />
        <text x="423" y="127" font-family="sans-serif" font-size="12" fill="#1890ff" text-anchor="middle">路由</text>
        <text x="600" y="125" font-family="sans-serif" font-size="14" fill="#262626">新增 /api/v2/payment 路由規則及上游伺服器</text>

        <line x1="24" y1="145" x2="1416" y2="145" stroke="#f0f0f0" />

        <!-- Table Row 2 -->
        <text x="40" y="174" font-family="sans-serif" font-size="14" fill="#595959">2026-03-01 16:45:12</text>
        <text x="200" y="174" font-family="sans-serif" font-size="14" fill="#595959">system_auto_bot</text>
        <rect x="395" y="159" width="56" height="24" rx="4" fill="#f6ffed" stroke="#b7eb8f" />
        <text x="423" y="176" font-family="sans-serif" font-size="12" fill="#52c41a" text-anchor="middle">憑證</text>
        <text x="600" y="174" font-family="sans-serif" font-size="14" fill="#262626">自動更新 Let's Encrypt TLS 泛域名憑證</text>

        <line x1="24" y1="194" x2="1416" y2="194" stroke="#f0f0f0" />
      </g>
    </g>
  </g>
</svg>

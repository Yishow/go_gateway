# Air 熱重載配置
# 安裝: go install github.com/cosmtrek/air@latest
# 使用: air
# 說明: 自動檢測程式碼變更並重新編譯運行，適合快速開發迭代

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # 注意: Air 會編譯到 tmp/main，但 test-ui 需要前端檔案
  # 前端檔案需手動建置或使用 start.ps1 的開發模式
  cmd = "go build -o ./tmp/main ./cmd/test_ui"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "web", "node_modules", ".git", "docs", "lib"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

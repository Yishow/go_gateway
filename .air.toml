# Air 熱重載配置
# 安裝與啟動: ./start.sh --dev 或 .\start.ps1 -Dev
# 說明: 自動檢測程式碼變更並重新編譯運行，適合快速開發迭代
# 注意: Air 專案已遷移到新倉庫 github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "bin/tmp"

[build]
  args_bin = []
  # Air v1.63.0 使用 bin；Windows 的執行檔需保留 .exe 副檔名。
  bin = "./bin/tmp/gateway-air.exe"
  cmd = "go build -o ./bin/tmp/gateway-air.exe ./cmd/test_ui"
  delay = 1000
  # 只監控必要的目錄，排除其他 cmd 子目錄和不需要的目錄
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "frontend", "node_modules", ".git", "docs", "scripts", "openspec", "cmd/fatek_test", "cmd/gateway", "cmd/test_all", "conductor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # full_bin 留空，直接執行 bin 指定的產物
  full_bin = ""
  # 監控所有目錄，但通過 exclude_dir 排除不需要的
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = ["go.mod", "go.sum"]
  kill_delay = "2s"
  log = "bin/tmp/build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true  # 發送中斷信號以優雅停止
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datalink Workbench · 接入點位設定流程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
        background: #0b1220;
        color: #f1f5f9;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss01';
      }
      /* 主背景 - 工業儀表板感 */
      .bg-canvas {
        background:
          radial-gradient(1200px 600px at 20% -10%, rgba(59, 130, 246, 0.08), transparent 60%),
          radial-gradient(900px 500px at 100% 110%, rgba(16, 185, 129, 0.05), transparent 55%),
          #0b1220;
      }
      /* 格線背景 - 點位畫布感 */
      .bg-grid {
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      /* 滾動條 */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.3);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.55);
      }
      /* 微動效 */
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(0.85);
        }
      }
      .pulse-dot {
        animation: pulseDot 1.6s ease-in-out infinite;
      }
      @keyframes sweepIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .sweep-in {
        animation: sweepIn 240ms ease-out both;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .shimmer {
        background: linear-gradient(
          90deg,
          rgba(59, 130, 246, 0) 0%,
          rgba(59, 130, 246, 0.18) 50%,
          rgba(59, 130, 246, 0) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.6s ease-in-out infinite;
      }
      /* 輸入框 base */
      .field {
        @apply w-full rounded-lg border border-slate-700/60 bg-slate-900/60 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 transition-colors focus:border-blue-500/70 focus:outline-none focus:ring-2 focus:ring-blue-500/20;
      }
      .label {
        @apply block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5;
      }
      .chip {
        @apply inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[11px] font-medium;
      }
      .kbd {
        @apply inline-flex items-center justify-center min-w-[18px] px-1.5 h-[18px] rounded border border-slate-600/60 bg-slate-800/80 text-[10px] font-mono text-slate-300;
      }
      /* 記憶體格子 */
      .mem-cell {
        position: relative;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 48px;
        cursor: pointer;
        user-select: none;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          transform 120ms ease;
      }
      .mem-cell:hover {
        transform: translateY(-1px);
      }
      .mem-cell .addr {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .mem-cell .meta {
        opacity: 0.7;
        font-size: 9px;
      }
    </style>
  </head>
  <body class="bg-canvas">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="shared.jsx"></script>
    <script type="text/babel" src="step1-device.jsx"></script>
    <script type="text/babel" src="step2-rule.jsx"></script>
    <script type="text/babel" src="step3-mapping.jsx"></script>
    <script type="text/babel" src="step4-database.jsx"></script>
    <script type="text/babel" src="settings.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>

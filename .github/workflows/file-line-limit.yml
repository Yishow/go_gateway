name: file-line-limit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-file-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run file line limit guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          echo "Using base SHA: ${BASE_SHA}"
          bash scripts/check_file_lines.sh --base "${BASE_SHA}"
